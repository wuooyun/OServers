[package]
name = "oservers"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# GUI
eframe = { version = "0.30", features = ["wgpu", "glow"] }
egui = "0.30"
wgpu = { version = "23.0.1", features = ["dx12"] }

# Async runtime
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "fs", "net", "macros", "time", "io-util"] }

# HTTP Server
warp = "0.3"

# FTP Server
libunftp = "=0.21.0"
unftp-sbe-fs = "0.3"

# TFTP
async-tftp = "0.3"

# SSH (simplified - we'll use a basic implementation)
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

# Utilities
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.14"

# Pinned versions for Rust 1.85 compatibility
time = "=0.3.36"
home = "=0.5.9"
russh-sftp = "2.3.0"
russh = "0.61.1"
rand = "0.10.1"
ssh-key = { version = "0.7.0-rc.10", features = ["ed25519", "rsa"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
