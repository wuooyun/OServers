name: Release

# Publishing a version means pushing a tag (e.g. `git tag v0.2.0 && git push
# origin v0.2.0`). That builds every platform and publishes the binaries to a
# GitHub Release named after the tag. The workflow can also be started
# manually for an existing tag from the Actions tab.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Never let two runs publish the same tag at the same time.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history + tags so `git describe --exact-match` in build.rs
          # can embed the release tag into the binary.
          fetch-depth: 0

      # Cargo.toml is the version source for local builds; a release binary
      # reports its tag instead. Warn (rather than fail) when they differ so a
      # forgotten version bump never blocks publishing.
      - name: Check tag matches Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from Cargo.toml"
            exit 1
          fi
          if [ "$version" != "${tag#v}" ]; then
            echo "::warning title=Version mismatch::Tag '$tag' differs from the Cargo.toml version '$version'. Release binaries display the tag; consider bumping the version for the next release."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: oservers.exe
            asset_name: oservers-${{ needs.prepare.outputs.tag }}-windows-x86_64.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: oservers
            asset_name: oservers-${{ needs.prepare.outputs.tag }}-linux-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: oservers
            asset_name: oservers-${{ needs.prepare.outputs.tag }}-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: oservers
            asset_name: oservers-${{ needs.prepare.outputs.tag }}-macos-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          chmod +x artifacts/* || true
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: OServers ${{ needs.prepare.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
